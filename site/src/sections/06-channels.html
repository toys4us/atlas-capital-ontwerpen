<section id="channels">
  <div class="grp" id="kanalen"><h2><span lang="nl">Locaties · 15 kanalen</span><span lang="en">Locations · 15 channels</span></h2></div>

  <!-- The server as a device. Left, a sidebar the way Discord draws one:
       the server's name, two categories, the fifteen channels as they
       stand, the six of Premium behind a lock. Right, the pane a channel
       opens on -- and since no message of the server is ours to show, the
       pane is drawn as a chart page: a two-line title (the channel, and
       what the page is) on the same rule as the server's name, and under
       it, inset from the frame, the figure of the spread with a scale on
       its right and its foot -- ticks, no numbers. The zones of the
       vocabulary carry their tags where a level is tagged, on the scale.
       No price, no day, no outcome, and the title says so. The selected
       row is a fair value gap band; the boundary of Premium is a dashed
       liquidity line; the locks are hairlines of the gold; the row
       numbers sit at the right like the levels of a price scale.
       Selecting a channel moves the band and retitles the pane; a Premium
       channel dims the figure under its lock and the one sentence that is
       true of it. The pane is decoration (aria-hidden); the list is
       content. Nothing here is a name, a count or a message. -->
  <figure class="dv" data-stagger="40">
    <div class="dv__frame">
      <div class="dv__side">
        <div class="dv__server reveal">
          <span class="dv__server-t"><span>Atlas Capital</span><i class="dv__chev" aria-hidden="true"></i></span>
          <span class="dv__server-s"><span lang="nl">Discord-server</span><span lang="en">Discord server</span></span>
        </div>
        <div class="dv__list">
          <p class="dv__cat reveal"><span lang="nl">Gratis &middot; voorlopig</span><span lang="en">Free &middot; for now</span></p>
          <button type="button" class="dv__ch reveal" data-kind="free" aria-pressed="true"><span class="dv__hash">#</span><span class="dv__chname">nq-chart-ideeën</span><span class="dv__n">01</span></button>
          <button type="button" class="dv__ch reveal" data-kind="free" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">es-chart-ideeën</span><span class="dv__n">02</span></button>
          <button type="button" class="dv__ch reveal" data-kind="free" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">bitcoin</span><span class="dv__n">03</span></button>
          <button type="button" class="dv__ch reveal" data-kind="free" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">altcoins</span><span class="dv__n">04</span></button>
          <button type="button" class="dv__ch reveal" data-kind="free" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">markt</span><span class="dv__n">05</span></button>
          <button type="button" class="dv__ch reveal" data-kind="free" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">vragen</span><span class="dv__n">06</span></button>
          <button type="button" class="dv__ch reveal" data-kind="free" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">algemeen</span><span class="dv__n">07</span></button>
          <button type="button" class="dv__ch reveal" data-kind="free" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">atlas-op-socials</span><span class="dv__n">08</span></button>
          <button type="button" class="dv__ch reveal" data-kind="free" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">ondersteuning</span><span class="dv__n">09</span></button>
          <p class="dv__cat dv__cat--prem reveal"><span lang="nl">Premium &middot; opent later</span><span lang="en">Premium &middot; opens later</span></p>
          <button type="button" class="dv__ch reveal" data-kind="lock" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">trade-setups</span><i class="dv__lock" aria-hidden="true"></i><span class="dv__n">10</span></button>
          <button type="button" class="dv__ch reveal" data-kind="lock" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">marktupdates</span><i class="dv__lock" aria-hidden="true"></i><span class="dv__n">11</span></button>
          <button type="button" class="dv__ch reveal" data-kind="lock" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">indicatoren</span><i class="dv__lock" aria-hidden="true"></i><span class="dv__n">12</span></button>
          <button type="button" class="dv__ch reveal" data-kind="lock" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">sessie-opnames</span><i class="dv__lock" aria-hidden="true"></i><span class="dv__n">13</span></button>
          <button type="button" class="dv__ch reveal" data-kind="lock" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">chart-ideeën</span><i class="dv__lock" aria-hidden="true"></i><span class="dv__n">14</span></button>
          <button type="button" class="dv__ch reveal" data-kind="lock" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">premium-chat</span><i class="dv__lock" aria-hidden="true"></i><span class="dv__n">15</span></button>
        </div>
      </div>
      <div class="dv__pane" data-kind="free" aria-hidden="true">
        <!-- the title of the page: the channel, then what the page is;
             one block, the height of the server's name, so the rule
             under the two runs unbroken across the device -->
        <div class="dv__title reveal" data-at="0">
          <p class="dv__name"><span class="dv__hash">#</span><span class="dv__name-t">nq-chart-ideeën</span></p>
          <p class="dv__sub"><span lang="nl">Schematisch &middot; geen koers, geen dag</span><span lang="en">Schematic &middot; no price, no day</span></p>
        </div>
        <!-- the figure, read left to right: the line ranges through a
             session, deviates once below the range out of an orderblock,
             rallies in three legs and leaves a gap (the band), puts three
             equal highs under the upper level, sweeps it once and falls
             back through the gap. It stops short of the scale: that is
             now. The plot is inset from the frame on every side; the
             zones are HTML, the page's own hairlines, and every level
             runs forward to the scale and stops there. The tags sit
             above the right end of their level, on the scale, where the
             line never comes; the orderblock's tag sits beside its box. -->
        <div class="dv__plate reveal trace" data-at="0">
          <div class="dv__ink">
            <i class="dv__ax dv__ax--y"></i>
            <i class="dv__ax dv__ax--x"></i>
            <i class="dv__lvl dv__lvl--hi"></i>
            <i class="dv__lvl dv__lvl--lo"></i>
            <i class="dv__band"></i>
            <i class="dv__ob"></i>
            <svg class="dv__fig" viewBox="0 0 600 400" preserveAspectRatio="none" aria-hidden="true" focusable="false">
              <path class="dv__line" pathLength="1" d="M0 238 18 228 36 246 54 234 72 252 90 240 108 256 124 244 136 268 146 292 156 310 166 296 174 274 180 262 190 278 204 226 214 242 228 196 238 212 258 130 270 146 286 92 296 108 306 68 320 98 336 68 350 102 366 68 380 100 394 44 406 84 418 122 430 106 444 150 454 190 464 180 474 206"/>
            </svg>
            <i class="dv__tag dv__tag--liq"><span lang="nl">Liquiditeit</span><span lang="en">Liquidity</span></i>
            <i class="dv__tag dv__tag--fvg">FVG</i>
            <i class="dv__tag dv__tag--ses"><span lang="nl">Sessie-liquiditeit</span><span lang="en">Session liquidity</span></i>
            <i class="dv__tag dv__tag--ob">Orderblock</i>
          </div>
          <div class="dv__locked"><span class="dv__locked-in">
            <i class="dv__lock"></i>
            <span class="dv__locked-t"><span lang="nl">Opent later</span><span lang="en">Opens later</span></span>
            <span class="dv__locked-n"><span lang="nl">Prijs en datum worden in de server aangekondigd.</span><span lang="en">The price and the date will be announced in the server.</span></span>
          </span></div>
        </div>
      </div>
    </div>
    <figcaption class="reveal">
      <span class="dv__cap"><span lang="nl">Figuur &mdash; De server</span><span lang="en">Figure &mdash; The server</span></span>
      <span class="dv__note"><span lang="nl">Vijftien kanalen zoals ze in de server staan: negen open, zes achter een slot tot Premium opent. Het paneel is een schema, geen bericht.</span><span lang="en">Fifteen channels as they stand in the server: nine open, six behind a lock until Premium opens. The pane is a schema, not a message.</span></span>
    </figcaption>
  </figure>
  <p class="dv__call"><a class="cta reveal" href="https://discord.gg/78Ff2GuSfW"><span lang="nl">Kom binnen op Discord</span><span lang="en">Step inside the Discord</span></a></p>

  <script>
  (function(){
    var s = document.getElementById("channels"); if (!s) return;
    var list = s.querySelector(".dv__list"), pane = s.querySelector(".dv__pane"), name = s.querySelector(".dv__name-t");
    if (!list || !pane || !name) return;
    var rows = list.querySelectorAll(".dv__ch");
    function rowOf(t){ while (t && t !== list) { if (t.classList && t.classList.contains("dv__ch")) return t; t = t.parentNode; } return null; }
    function pick(b){
      for (var i = 0; i < rows.length; i++) rows[i].setAttribute("aria-pressed", rows[i] === b ? "true" : "false");
      var n = b.querySelector(".dv__chname");
      name.textContent = n ? n.textContent : "";
      pane.setAttribute("data-kind", b.getAttribute("data-kind") || "free");
    }
    list.addEventListener("click", function(e){ var b = rowOf(e.target); if (b) pick(b); });
    /* the cue at the list's foot: only while the list has more below */
    var side = s.querySelector(".dv__side");
    function cue(){ if (side) side.classList.toggle("is-more", list.scrollHeight - list.clientHeight - list.scrollTop > 4); }
    list.addEventListener("scroll", cue, { passive: true });
    window.addEventListener("resize", cue);
    cue(); setTimeout(cue, 800);
    list.addEventListener("keydown", function(e){
      var b = rowOf(e.target); if (!b) return;
      var i = Array.prototype.indexOf.call(rows, b), j = -1, k = e.key;
      if (k === "ArrowDown") j = Math.min(rows.length - 1, i + 1);
      else if (k === "ArrowUp") j = Math.max(0, i - 1);
      else if (k === "Home") j = 0;
      else if (k === "End") j = rows.length - 1;
      if (j < 0 || j === i) return;
      e.preventDefault(); rows[j].focus(); pick(rows[j]);
    });
  })();
  </script>
</section>
