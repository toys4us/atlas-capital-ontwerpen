<section id="channels">
  <div class="grp" id="kanalen"><h2><span lang="nl">Locaties · 15 kanalen</span><span lang="en">Locations · 15 channels</span></h2></div>

  <!-- The server as a device. A sidebar the way Discord draws one -- the
       server's name, two categories, the fifteen channels as they stand,
       and at its foot the place a member's own panel sits -- beside a
       message pane that holds no messages: skeleton lines only, and in
       one of them a chart drawn as a schema (one line, one orderblock,
       one gap, one level; no price, no day). The selected row is a fair
       value gap band; the boundary of Premium is a dashed liquidity line;
       the locks are hairlines of the gold; the row numbers sit at the
       right like the levels of a price scale. Selecting a channel moves
       the band and names the channel in the pane. The pane and the foot
       are decoration (aria-hidden); the list is content. Nothing here is
       a name, a count or a message. -->
  <figure class="dv" data-stagger="40">
    <div class="dv__frame">
      <div class="dv__side">
        <div class="dv__server reveal"><span>Atlas Capital</span><i class="dv__chev" aria-hidden="true"></i></div>

          <button type="button" class="dv__ch reveal" data-kind="chart" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">es-chart-ideeën</span><span class="dv__n">02</span></button>
          <button type="button" class="dv__ch reveal" data-kind="chart" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">bitcoin</span><span class="dv__n">03</span></button>
          <button type="button" class="dv__ch reveal" data-kind="chart" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">altcoins</span><span class="dv__n">04</span></button>
          <button type="button" class="dv__ch reveal" data-kind="chat" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">markt</span><span class="dv__n">05</span></button>
          <button type="button" class="dv__ch reveal" data-kind="chat" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">vragen</span><span class="dv__n">06</span></button>
          <button type="button" class="dv__ch reveal" data-kind="chat" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">algemeen</span><span class="dv__n">07</span></button>
          <button type="button" class="dv__ch reveal" data-kind="chat" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">atlas-op-socials</span><span class="dv__n">08</span></button>
          <button type="button" class="dv__ch reveal" data-kind="chat" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">ondersteuning</span><span class="dv__n">09</span></button>
          <p class="dv__cat dv__cat--prem reveal"><span lang="nl">Premium &middot; opent later</span><span lang="en">Premium &middot; opens later</span></p>
          <button type="button" class="dv__ch reveal" data-kind="lock" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">trade-setups</span><i class="dv__lock" aria-hidden="true"></i><span class="dv__n">10</span></button>
          <button type="button" class="dv__ch reveal" data-kind="lock" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">marktupdates</span><i class="dv__lock" aria-hidden="true"></i><span class="dv__n">11</span></button>
          <button type="button" class="dv__ch reveal" data-kind="lock" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">indicatoren</span><i class="dv__lock" aria-hidden="true"></i><span class="dv__n">12</span></button>
          <button type="button" class="dv__ch reveal" data-kind="lock" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">sessie-opnames</span><i class="dv__lock" aria-hidden="true"></i><span class="dv__n">13</span></button>
          <button type="button" class="dv__ch reveal" data-kind="lock" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">chart-ideeën</span><i class="dv__lock" aria-hidden="true"></i><span class="dv__n">14</span></button>
          <button type="button" class="dv__ch reveal" data-kind="lock" aria-pressed="false"><span class="dv__hash">#</span><span class="dv__chname">premium-chat</span><i class="dv__lock" aria-hidden="true"></i><span class="dv__n">15</span></button>
        </div>
        <!-- the member's own panel, as Discord sets it under the list: an
             avatar, a name, three controls -- drawn as skeleton, so it is a
             place and not a person -->
        <div class="dv__me reveal" aria-hidden="true"><i class="dv__av"></i><i class="dv__ln dv__ln--name"></i><i class="dv__ctl"></i><i class="dv__ctl"></i><i class="dv__ctl"></i></div>
      </div>
      <div class="dv__pane" data-kind="chart" aria-hidden="true">
        <div class="dv__head reveal" data-at="0"><span class="dv__hash">#</span><span class="dv__name">nq-chart-ideeën</span></div>

          <div class="dv__msg reveal" data-at="40"><i class="dv__av"></i><i class="dv__ln dv__ln--name" style="width:80px"></i><i class="dv__ln" style="width:42%"></i></div>
          <div class="dv__msg reveal" data-at="80"><i class="dv__av"></i><i class="dv__ln dv__ln--name" style="width:74px"></i><i class="dv__ln" style="width:82%"></i><i class="dv__ln" style="width:46%"></i></div>
          <div class="dv__msg reveal" data-at="160"><i class="dv__av"></i><i class="dv__ln dv__ln--name" style="width:52px"></i><i class="dv__ln" style="width:63%"></i>
            <div class="dv__plate">
              <svg class="dv__fig" viewBox="0 0 300 120" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                <rect class="dv__zone" x="42" y="86" width="22" height="12"/>
                <rect class="dv__zone" x="214" y="50" width="86" height="10"/>
                <line class="dv__zone dv__level" x1="150" y1="18" x2="300" y2="18"/>
                <path class="dv__line" pathLength="1" d="M0 70 20 74 40 68 52 94 66 84 90 90 110 60 126 66 150 34 164 44 186 14 200 22 214 40 230 34 250 62 262 56 280 84 300 78"/>
              </svg>
            </div>
          </div>
          <div class="dv__msg reveal" data-at="240"><i class="dv__av"></i><i class="dv__ln dv__ln--name" style="width:88px"></i><i class="dv__ln" style="width:38%"></i></div>
          <div class="dv__msg reveal" data-at="320"><i class="dv__av"></i><i class="dv__ln dv__ln--name" style="width:60px"></i><i class="dv__ln" style="width:88%"></i><i class="dv__ln" style="width:71%"></i><i class="dv__ln" style="width:29%"></i></div>
          <div class="dv__msg reveal" data-at="400"><i class="dv__av"></i><i class="dv__ln dv__ln--name" style="width:66px"></i><i class="dv__ln" style="width:54%"></i></div>
          <div class="dv__locked"><i class="dv__lock"></i><span><span lang="nl">Opent later</span><span lang="en">Opens later</span></span></div>
        </div>
        <div class="dv__composer reveal" data-at="480"></div>
      </div>
    </div>
    <figcaption class="reveal">
      <span class="dv__title"><span lang="nl">Figuur &mdash; De server, schematisch</span><span lang="en">Figure &mdash; The server, as a schema</span></span>
      <span class="dv__note"><span lang="nl">De kanalen zoals ze in de server staan. Geen berichten; die lees je daar.</span><span lang="en">The channels as they stand in the server. No messages; you read those there.</span></span>
    </figcaption>
  </figure>
  <p class="dv__call"><a class="cta reveal" href="https://discord.gg/78Ff2GuSfW"><span lang="nl">Kom binnen op Discord</span><span lang="en">Step inside the Discord</span></a></p>

  <script>
  (function(){
    var s = document.getElementById("channels"); if (!s) return;
    var list = s.querySelector(".dv__list"), pane = s.querySelector(".dv__pane"), name = s.querySelector(".dv__name");
    if (!list || !pane || !name) return;
    var rows = list.querySelectorAll(".dv__ch");
    function rowOf(t){ while (t && t !== list) { if (t.classList && t.classList.contains("dv__ch")) return t; t = t.parentNode; } return null; }
    function pick(b){
      for (var i = 0; i < rows.length; i++) rows[i].setAttribute("aria-pressed", rows[i] === b ? "true" : "false");
      var n = b.querySelector(".dv__chname");
      name.textContent = n ? n.textContent : "";
      pane.setAttribute("data-kind", b.getAttribute("data-kind") || "chat");
    }
    list.addEventListener("click", function(e){ var b = rowOf(e.target); if (b) pick(b); });
    /* the cue at the list's foot: only while the list has more below */
    var side = s.querySelector(".dv__side");
    function cue(){ if (side) side.classList.toggle("is-more", list.scrollHeight - list.clientHeight - list.scrollTop > 4); }
    list.addEventListener("scroll", cue, { passive: true });
    window.addEventListener("resize", cue);
    cue(); setTimeout(cue, 800);
    list.addEventListener("keydown", function(e){
      var b = rowOf(e.target); if (!b) return;
      var i = Array.prototype.indexOf.call(rows, b), j = -1, k = e.key;
      if (k === "ArrowDown") j = Math.min(rows.length - 1, i + 1);
      else if (k === "ArrowUp") j = Math.max(0, i - 1);
      else if (k === "Home") j = 0;
      else if (k === "End") j = rows.length - 1;
      if (j < 0 || j === i) return;
      e.preventDefault(); rows[j].focus(); pick(rows[j]);
    });
  })();
  </script>
</section>
