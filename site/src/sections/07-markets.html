<section id="markets">
  <div class="grp"><h2><span lang="nl">Markten</span><span lang="en">Markets</span></h2></div>

  <!-- The one chapter that leaves the strip. Everywhere else the page is
       read in the reel's column; here it opens to the width of the window
       and the eight markets are set at the size of a headline, four lines
       -- one per group -- on a band of the plate's own ground, closed top
       and bottom by a hairline that runs to both edges of the screen.

       One vertical, and it is the page's own. The strip's right edge comes
       down out of the chapter title, and where the band begins it is not
       covered but carried: the scale inside the band stands on that same
       axis and runs the whole height of the band, from the top hairline to
       the bottom one. So the line the reader has been following since the
       first reel never breaks -- it passes through the chapter and comes
       out below it. The break-out is to the left only: the type crosses
       the strip's left edge and runs on to the window, which is what makes
       this chapter the one that leaves the strip. Everything in the band
       is measured to that axis -- the group tags hang off it, each leader
       lands on it, the caption and the call end on it -- and every level
       rule crosses it and runs on to both edges of the screen.

       The four groups are not four rows. They descend, in the order the
       trader names them: indices at the full display size on the heaviest
       rule, then metals, then energy, then crypto -- each line smaller,
       its rule lighter, its air tighter, its ink a step quieter. Read down
       the band and the wall fades; read across a line and the type gives
       out, a fixed leader takes over and hands the line to its tag. The
       leader is one declared length on all four lines and lands on the
       axis every time, so the emptiness beside a group of one is a measure
       and not an accident.

       No code is set against a name. The client named a ticker for three
       of the eight and for five of them named none, so either all eight
       carry one or the wall carries none; it carries none. No price, no
       change, no numeral: eight names, four groups, and the caption says
       exactly that. The chapter closes on the axis it was built on -- the
       founder trades them live, the call at the far end of the statement's
       own line. -->
