<section id="markets">
  <div class="grp"><h2><span lang="nl">Markten</span><span lang="en">Markets</span></h2></div>

  <!-- The one chapter that leaves the strip. Everywhere else the page is
       read in the reel's column; here it opens to the width of the window
       and the eight markets are set at the size of a headline, four lines
       -- one per group -- on a band of the plate's own ground, closed top
       and bottom by a hairline that runs to both edges of the screen.

       A group is one line, and a group is not a row: its markets are set
       at a size that follows how many of them there are, so the wall has
       a cadence -- three names at the full display size, two at three
       quarters of it, one at a little over half -- and the four lines
       stand at four heights, with the air under each cut to the same
       measure. Where the names stop, a hairline carries the line on to
       the tag: on Indices a stub, on Energy most of the window. The
       emptiness beside one market is drawn, not left, and it is drawn by
       the same rule on all four lines -- the length of the leader is the
       group's weight read backwards.

       No code is set against a name. The client named a ticker for three
       of the eight and for five of them named none, so either all eight
       carry one or the wall carries none; it carries none. At the far end
       of every line stands the board's scale, and the group's tag is set
       against it in the label caps -- eleven pixels of caps, and between
       forty-eight and eighty-eight of serif, on one baseline. Under every
       group a level runs edge to edge of the screen. No price, no change,
       no numeral: eight names, four groups, and the caption says exactly
       that. The chapter closes on the width it opened with -- the founder
       trades them live, on the markets' own axis, the call at the far
       edge of the band on the statement's line. -->
  <div class="wall" data-stagger="90">
    <i class="wall__edge wall__edge--t reveal draw" aria-hidden="true"></i>

    <figure class="wall__fig">
     <div class="wall__board">
      <i class="wall__axis reveal" data-at="0" aria-hidden="true"></i>
      <dl class="wall__list">

        <div class="wall__grp" data-n="3">
          <dt class="wall__tag reveal">Indices</dt>
          <dd class="wall__names reveal wipe">
            <span class="mk">Nasdaq</span>
            <span class="mk">S&amp;P&nbsp;500</span>
            <span class="mk">Dow&nbsp;Jones</span>
            <i class="mk__lead" aria-hidden="true"></i>
          </dd>
          <i class="wall__rule reveal draw" aria-hidden="true"></i>
        </div>

        <div class="wall__grp" data-n="2">
          <dt class="wall__tag reveal"><span lang="nl">Metalen</span><span lang="en">Metals</span></dt>
          <dd class="wall__names reveal wipe">
            <span class="mk"><span lang="nl">Goud</span><span lang="en">Gold</span></span>
            <span class="mk"><span lang="nl">Zilver</span><span lang="en">Silver</span></span>
            <i class="mk__lead" aria-hidden="true"></i>
          </dd>
          <i class="wall__rule reveal draw" aria-hidden="true"></i>
        </div>

        <div class="wall__grp" data-n="1">
          <dt class="wall__tag reveal"><span lang="nl">Energie</span><span lang="en">Energy</span></dt>
          <dd class="wall__names reveal wipe">
            <span class="mk"><span lang="nl">Olie</span><span lang="en">Oil</span></span>
            <i class="mk__lead" aria-hidden="true"></i>
          </dd>
          <i class="wall__rule reveal draw" aria-hidden="true"></i>
        </div>

        <div class="wall__grp" data-n="2">
          <dt class="wall__tag reveal">Crypto</dt>
          <dd class="wall__names reveal wipe">
            <span class="mk">Bitcoin</span>
            <span class="mk">Altcoins</span>
            <i class="mk__lead" aria-hidden="true"></i>
          </dd>
          <i class="wall__rule reveal draw" aria-hidden="true"></i>
        </div>
      </dl>
     </div>

      <!-- the caption, on the markets' own axis, in the voice of every
           figure on the page: the figure's name in caps, its note in the serif -->
      <figcaption class="wall__cap reveal">
        <span class="wall__title"><span lang="nl">Figuur &mdash; De markten</span><span lang="en">Figure &mdash; The markets</span></span>
        <span class="wall__note"><span lang="nl">Acht markten in vier groepen: waar het in de server over gaat. Geen koers, geen verandering &mdash; een lijst, geen feed.</span><span lang="en">Eight markets in four groups: what the server is about. No price, no change &mdash; a list, not a feed.</span></span>
      </figcaption>
    </figure>

    <!-- Live: the statement on the markets' axis, the one accent of the
         screen the word itself in the italic gold, its line under it and the
         call at the band's far edge on the statement's own line. When is
         announced in the server and nowhere else, so nothing here is a time. -->
    <div class="live" id="live">
      <p class="live__line"><span class="mask"><span class="reveal"><span lang="nl">De oprichter handelt <em>live</em>.</span><span lang="en">The founder trades <em>live</em>.</span></span></span></p>
      <p class="live__sub reveal"><span lang="nl">In de server, op tijden die daar worden aangekondigd.</span><span lang="en">In the server, at times announced there.</span></p>
      <a class="cta reveal" href="https://discord.gg/78Ff2GuSfW"><span lang="nl">Naar de server</span><span lang="en">To the server</span></a>
    </div>

    <i class="wall__edge wall__edge--b reveal draw" aria-hidden="true"></i>
  </div>
</section>
