  <!-- Two beats, both on the column line. There is no portrait and no

       0 with its top on the cap line. The numeral stands on a level -- the
       dashed hairline of the opening plate's liquidity line -- that runs
       out of the plus along the baseline and ends, a dash short, at what
       the numeral counts: "jaar actief in trading", standing on the same
       line at credit size, with his own account of those years under it
       (cut from his first sentence, never rewritten). The level leads
       from the number to its unit on every width; it never runs to an
       edge. One number, no instrument, no date: a schema, not a chart.

       The second beat is the founder's own words: a short rule of the
       gold, the quote at pull-quote size on the column line at a measure
       of forty-odd characters, and the signature under the last line --
       the page's link construction, a rule of the gold then the words in
       italic. NL as on the page; EN is the official text, verbatim.
       Each beat is its own reveal sequence, so the words come in when
       the reader reaches them and not while the numeral is still
       arriving. -->
