<section id="founder">
  <div class="grp"><h2><span lang="nl">Hoofdrol</span><span lang="en">Starring</span></h2></div>

  <!-- One row on the reel's shared axis (base.css: --axis-l / --axis-r),
       read as one credit. Left of the axis, in the label column, the
       numeral "10+" is the tag of a level: from its right side the dashed
       hairline of the opening plate's liquidity line runs along its
       baseline across the gutter and ends where the words begin. Right of
       the axis, in the value column, the founder's own words at pull-quote
       size, their first line standing on that same baseline, and under
       them the signature on a short rule of the gold. Under the numeral,
       on its own left edge, what the numeral counts -- "jaar actief in
       trading" -- and his own account of those years, cut from his first
       sentence and not rewritten. One number, no instrument, no date: a
       schema, not a chart. The plus is decoration for the eye; the words
       carry the fact. NL as on the page; EN is the official text,
       verbatim. The whole row is one reveal sequence. -->
  <div class="role" data-stagger="120">
    <div class="ten">
      <p class="ten__row">
        <span class="mask"><span class="ten__num reveal" data-at="0">10<span class="ten__plus" aria-hidden="true">+</span></span></span>
        <i class="ten__lvl reveal wipe" data-at="160" aria-hidden="true"></i>
      </p>
      <p class="ten__words reveal" data-at="360"><span lang="nl">jaar actief in trading</span><span lang="en">years active in trading</span></p>
      <p class="ten__sub reveal" data-at="480"><span lang="nl">winst, verlies, fouten, groei en vooral heel veel lessen</span><span lang="en">wins, losses, mistakes, growth, and a lot of lessons</span></p>
    </div>

    <figure class="word">
      <blockquote class="reveal" data-at="300"><p>
        <span lang="nl">&#8220;Atlas Capital heb ik gebouwd om die ervaring te delen, traders samen te brengen en te laten
        zien hoe ik de markten dagelijks benader. Geen <span class="nb">snelle-rijk-verhalen</span>, maar echte setups,
        educatie en een community die samen beter wil worden.&#8221;</span><span lang="en">&#8220;I built Atlas Capital to share that experience, bring traders together, and show how I
        approach the markets on a daily basis. No <span class="nb">get-rich-quick</span> promises, just real setups,
        education, and a community focused on improving together.&#8221;</span>
      </p></blockquote>
      <figcaption class="who reveal" data-at="900"><span lang="nl">de oprichter</span><span lang="en">the founder</span></figcaption>
    </figure>
  </div>
</section>
