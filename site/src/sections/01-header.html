<header id="header">
  <div class="inner">
    <a class="wm" href="#hero" aria-label="Atlas Capital">
      <img class="wm__mark" src="assets/logo-mark.svg" alt="" width="420" height="342">
      <b>Atlas&nbsp;Capital</b>
    </a>
    <!-- the one call, dead-centre of the bar, in one measured slot. The
         word and its arrow are always there; the prefix -- the rule and the
         verb -- is a grid track that is 0fr while another gold call is on
         screen and 1fr when none is (motion.js toggles .solid), so the label
         grows from the dash and the row either side of it re-centres in one
         eased move. Nothing is reserved: at rest the slot is exactly the
         width of the word. The prefix is never hidden from the reader, only
         clipped for the eye, so the link's name is the full call whatever
         its state. -->
    <a class="cta" href="https://discord.gg/78Ff2GuSfW">
      <span class="cta__pre"><i class="cta__rule" aria-hidden="true"></i><span class="cta__verb"><span lang="nl">Open de</span><span lang="en">Open the</span></span></span>
      <span class="cta__word">Discord</span>
    </a>
    <!-- the contents line: two anchors either side of the call on a desk,
         a drawer of levels under the bar everywhere else. Each row is a
         level: the name, a hairline, and on the right gutter -- the axis of
         the page, where the spread's labels sit -- the reel number, read
         off the page's own group titles by the script below so it is
         never typed twice; the tag is empty without it. -->
    <nav class="nav" id="hdr-nav" aria-label="Secties / Sections">
      <div class="lv lv--l">
        <a href="#educatie"><span class="lv__name"><span lang="nl">Educatie</span><span lang="en">Education</span></span><b class="n" aria-hidden="true"></b></a>
        <a href="#kanalen"><span class="lv__name"><span lang="nl">Kanalen</span><span lang="en">Channels</span></span><b class="n" aria-hidden="true"></b></a>
      </div>
      <div class="lv lv--r">
        <a href="#trackrecord"><span class="lv__name"><span lang="nl">Trackrecord</span><span lang="en">Track record</span></span><b class="n" aria-hidden="true"></b></a>
        <a href="#access"><span class="lv__name"><span lang="nl">Toegang</span><span lang="en">Access</span></span><b class="n" aria-hidden="true"></b></a>
      </div>
      <!-- the rail's two market clocks, for the widths where there is no
           rail: motion.js writes the time into [data-clock]. Decoration
           for the eye, not content (aria-hidden), and only with the
           script that makes them tick. -->
      <p class="now" aria-hidden="true"><span><span class="now__city">Amsterdam</span> <time data-clock="Europe/Amsterdam">--:--:--</time></span><span><span class="now__city">New York</span> <time data-clock="America/New_York">--:--:--</time></span></p>
      <div class="foot">
        <div class="langsw" role="group" aria-label="Taal / Language">
          <button type="button" data-lang="nl" aria-pressed="true">NL</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <a class="tk" href="https://www.tiktok.com/@atlascapitalbv">TikTok</a>
      </div>
    </nav>
    <button class="menu" type="button" aria-expanded="false" aria-controls="hdr-nav">
      <span class="menu__open"><span lang="nl">Menu</span><span lang="en">Menu</span></span>
      <span class="menu__close"><span lang="nl">Sluiten</span><span lang="en">Close</span></span>
    </button>
  </div>
  <script>
  /* the bar's own state: .is-top (transparent over the spread; motion.js
     sets the same class by the same rule, this runs first so the first
     paint is right), the drawer under the bar on anything narrower than
     the full row, and aria-current on the anchor whose section holds the
     upper part of the viewport. One passive listener, one rAF. */
  (function(){
    var hdr = document.getElementById("header"); if (!hdr) return;
    var W = window, root = document.documentElement;
    var nav = hdr.querySelector(".nav"), btn = hdr.querySelector(".menu");
    var links = Array.prototype.slice.call(nav.querySelectorAll('a[href^="#"]'));
    var wide = W.matchMedia("(min-width: 1120px)");
    function pad(n){ return n < 10 ? "0" + n : "" + n; }
    /* which section each anchor leads to, and its reel number -- resolved
       once the rest of the page is parsed (this script runs before it) */
    var secs = [], cur = null;
    function resolve(){
      var grps = Array.prototype.slice.call(document.querySelectorAll(".roll .grp")), i, t, g, n;
      secs = [];
      for (i = 0; i < links.length; i++) {
        try { t = document.querySelector(links[i].getAttribute("href")); } catch(e) { t = null; }
        if (!t) { secs.push(null); continue; }
        secs.push(t.closest("section") || t);
        g = t.classList.contains("grp") ? t : t.querySelector(".grp");
        n = links[i].querySelector(".n");
        if (g && n && grps.indexOf(g) >= 0) n.textContent = pad(grps.indexOf(g) + 1);
      }
      ask();
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", resolve); else resolve();
    function frame(){
      ticking = false;
      var y = W.scrollY || W.pageYOffset || 0;
      hdr.classList.toggle("is-top", y < 8);
      var line = (W.innerHeight || root.clientHeight) * 0.4, at = null, i, r;
      for (i = 0; i < secs.length; i++) {
        if (!secs[i]) continue;
        r = secs[i].getBoundingClientRect();
        if (r.top <= line && r.bottom > line) at = links[i];
      }
      if (at === cur) return;
      if (cur) cur.removeAttribute("aria-current");
      if (at) at.setAttribute("aria-current", "location");
      cur = at;
    }
    var ticking = false;
    function ask(){ if (!ticking) { ticking = true; W.requestAnimationFrame(frame); } }
    W.addEventListener("scroll", ask, { passive: true });
    W.addEventListener("resize", ask);
    frame();
    /* the drawer. The page is held still under it by locking the body,
       never the root: overflow on <html> re-roots the scroller and a
       sticky bar lets go of the top. */
    var open = false;
    function focusables(){
      return Array.prototype.filter.call(hdr.querySelectorAll("a[href],button"), function(el){
        return el.offsetParent !== null || el.getClientRects().length;
      });
    }
    function setOpen(v, back){
      if (v === open) return;
      open = v;
      hdr.classList.toggle("is-open", v);
      btn.setAttribute("aria-expanded", v ? "true" : "false");
      if (v) {
        nav.classList.add("is-open");
        void nav.offsetHeight;
        nav.classList.add("is-in");
        document.body.style.overflow = "hidden";
        try { links[0].focus({ preventScroll: true }); } catch(e) {}
      } else {
        nav.classList.remove("is-in");
        nav.classList.remove("is-open");
        document.body.style.overflow = "";
        if (back) { try { btn.focus({ preventScroll: true }); } catch(e) {} }
      }
    }
    btn.addEventListener("click", function(){ setOpen(!open); });
    nav.addEventListener("click", function(e){
      if (e.target.closest && e.target.closest('a[href^="#"]')) setOpen(false);
    });
    document.addEventListener("keydown", function(e){
      if (!open) return;
      if (e.key === "Escape" || e.key === "Esc") { setOpen(false, true); return; }
      if (e.key !== "Tab") return;
      var f = focusables(), first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
    function onWide(){ if (wide.matches) setOpen(false); }
    if (wide.addEventListener) wide.addEventListener("change", onWide); else if (wide.addListener) wide.addListener(onWide);
  })();
  </script>
</header>
