  <!-- four credits on the shared axis (base.css dl.pairs), set as a spec
       sheet: the label at the left edge of the label column, a leader --
       the dashed hairline of the opening plate's liquidity line, on the
       baseline the two columns share -- runs out of it across the gutter
       and stops a step short of the value, which stands on the column
       line with every other value on the reel. Same construction as the
       numeral and its level on the next reel. The last credit has two
       lines: the place, at credit size, and under it, on the same column
       line, its address -- the one small fact that is a code, so it is
       set in the mono at caption size, and it is the link, closed with
       the arrow of the bar.

       The reveal is authored here, not left to the auto-stagger: per row
       the label surfaces, the leader draws out of it towards the value (a
       wipe, so the dashes stay put), and the value rises through its own
       baseline out of its own line box. Rows follow 80ms apart; the
       address is the last beat, in place, after its word. Every slot is
       inside the scroll cap of motion.js (420ms). -->
  <dl class="pairs" data-stagger="80">
    <dt><span class="tag reveal" data-at="0">Community</span><i class="lvl reveal wipe" data-at="40" aria-hidden="true"></i></dt>

    <dd>
