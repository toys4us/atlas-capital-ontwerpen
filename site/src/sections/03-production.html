<section id="production">
  <div class="grp"><h2><span lang="nl">Productie</span><span lang="en">Production</span></h2></div>
  <!-- four credits on the shared axis (base.css dl.pairs). Each row is
       one composed level: a leader -- the dashed hairline of the opening
       plate's liquidity line -- runs from the strip's left edge to the
       label, which is the tag at its end; the value sits left of the axis
       on the same baseline. The one small fact that is a code, the
       server's address, hangs after the word in the mono, a size down and
       a hair below the baseline, the way a role follows a name.

       The reveal is authored here, not left to the auto-stagger: per row
       the leader draws out of the frame (a wipe, so the dashes stay put),
       the label surfaces at its end, and the value rises through its own
       baseline out of a mask. Rows follow 110ms apart; the whole timeline
       sits inside the scroll cap of motion.js. -->
  <dl class="pairs" data-stagger="110">
    <dt><i class="lvl reveal wipe" data-at="0" aria-hidden="true"></i><span class="tag reveal" data-at="70">Community</span></dt>
    <dd><span class="mask"><span class="val reveal" data-at="150">Atlas Capital</span></span></dd>

    <dt><i class="lvl reveal wipe" data-at="110" aria-hidden="true"></i><span class="tag reveal" data-at="180">Tagline</span></dt>
    <dd><span class="mask"><span class="val reveal" data-at="260"><em><span lang="nl">Proces. Discipline. Uitvoering.</span><span lang="en">Process. Discipline. Execution.</span></em></span></span></dd>

    <dt><i class="lvl reveal wipe" data-at="220" aria-hidden="true"></i><span class="tag reveal" data-at="290"><span lang="nl">Taal</span><span lang="en">Language</span></span></dt>

    <dt><i class="lvl reveal wipe" data-at="330" aria-hidden="true"></i><span class="tag reveal" data-at="400"><span lang="nl">Locatie</span><span lang="en">Location</span></span></dt>
    <dd><span class="mask"><span class="val reveal" data-at="420">Discord</span></span><small class="addr reveal" data-at="420"><a href="https://discord.gg/78Ff2GuSfW">discord.gg/78Ff2GuSfW</a></small></dd>
  </dl>
